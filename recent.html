<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAGI · 近日熱點</title>
<style>
:root{
  --bg:#ffffff;--bg2:#f8fafc;--bg3:#f1f5f9;--border:#e2e8f0;--border2:#edf0f4;
  --text:#1e293b;--text2:#475569;--muted:#64748b;--dimmer:#94a3b8;--bright:#0f172a;
  --accent:#7c3aed;--accent2:#7c3aed;
  --up:#dc2626;--dn:#16a34a;
  --up-bg:rgba(220,38,38,.07);--dn-bg:rgba(22,163,74,.07);
  --up-bd:rgba(220,38,38,.2);--dn-bd:rgba(22,163,74,.2);
  --glow:rgba(124,58,237,.07);--nav-bg:rgba(255,255,255,.85);
  --hot-bd:rgba(245,158,11,.35);--hot-bg:rgba(245,158,11,.04);
}
@media(prefers-color-scheme:dark){
  :root{--bg:#0d1117;--bg2:#161b22;--bg3:#1a1f2a;--border:#21262d;--border2:#1a1f2a;
  --text:#e2e8f0;--text2:#94a3b8;--muted:#64748b;--dimmer:#475569;--bright:#f8fafc;
  --accent:#7c3aed;--accent2:#c084fc;--up:#e05252;--dn:#2ec27a;
  --up-bg:rgba(224,82,82,.12);--dn-bg:rgba(46,194,122,.12);
  --up-bd:rgba(224,82,82,.22);--dn-bd:rgba(46,194,122,.22);
  --glow:rgba(124,58,237,.18);--nav-bg:rgba(13,17,23,.82);
  --hot-bd:rgba(245,158,11,.4);--hot-bg:rgba(245,158,11,.06);}
}
:root[data-theme="light"]{--bg:#ffffff;--bg2:#f8fafc;--bg3:#f1f5f9;--border:#e2e8f0;--border2:#edf0f4;--text:#1e293b;--text2:#475569;--muted:#64748b;--dimmer:#94a3b8;--bright:#0f172a;--accent:#7c3aed;--accent2:#7c3aed;--up:#dc2626;--dn:#16a34a;--up-bg:rgba(220,38,38,.07);--dn-bg:rgba(22,163,74,.07);--up-bd:rgba(220,38,38,.2);--dn-bd:rgba(22,163,74,.2);--glow:rgba(124,58,237,.07);--nav-bg:rgba(255,255,255,.85);--hot-bd:rgba(245,158,11,.35);--hot-bg:rgba(245,158,11,.04)}
:root[data-theme="dark"]{--bg:#0d1117;--bg2:#161b22;--bg3:#1a1f2a;--border:#21262d;--border2:#1a1f2a;--text:#e2e8f0;--text2:#94a3b8;--muted:#64748b;--dimmer:#475569;--bright:#f8fafc;--accent:#7c3aed;--accent2:#c084fc;--up:#e05252;--dn:#2ec27a;--up-bg:rgba(224,82,82,.12);--dn-bg:rgba(46,194,122,.12);--up-bd:rgba(224,82,82,.22);--dn-bd:rgba(46,194,122,.22);--glow:rgba(124,58,237,.18);--nav-bg:rgba(13,17,23,.82);--hot-bd:rgba(245,158,11,.4);--hot-bg:rgba(245,158,11,.06)}

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'PingFang TC','Noto Sans TC',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}

/* Nav */
nav{display:flex;align-items:center;justify-content:space-between;padding:18px 40px;
  position:sticky;top:0;z-index:100;background:var(--nav-bg);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.nav-logo{font-size:15px;font-weight:800;color:var(--bright);text-decoration:none;letter-spacing:-.3px}
.nav-logo em{color:var(--accent2);font-style:normal}
.nav-right{display:flex;align-items:center;gap:28px}
.nav-links{display:flex;gap:24px}
.nav-links a{font-size:13px;color:var(--muted);text-decoration:none;transition:color .15s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--accent2);font-weight:600}
.theme-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:5px 8px;
  cursor:pointer;font-size:14px;color:var(--muted);transition:border-color .15s,color .15s;line-height:1}
.theme-btn:hover{border-color:var(--accent2);color:var(--accent2)}
@media(max-width:600px){.nav-links{display:none}}

/* Layout */
.page-wrap{max-width:780px;margin:0 auto;padding:36px 24px 80px}
.page-header{margin-bottom:28px}
.page-title{font-size:22px;font-weight:800;color:var(--bright);letter-spacing:-.4px;margin-bottom:6px}
.page-sub{font-size:13px;color:var(--muted)}

/* Date section */
.date-section{margin-bottom:40px}
.date-label{display:flex;align-items:center;gap:8px;margin-bottom:14px;
  padding-bottom:12px;border-bottom:2px solid var(--border)}
.date-badge{font-size:14px;font-weight:800;color:var(--bright);letter-spacing:-.3px}
.date-today{font-size:10px;font-weight:700;color:var(--up);background:var(--up-bg);
  border:1px solid var(--up-bd);padding:2px 8px;border-radius:100px}
.date-count{font-size:11px;color:var(--dimmer);margin-left:auto}

/* Stock cards */
.sc{background:var(--bg2);border:1px solid var(--border);border-radius:12px;
  margin-bottom:10px;overflow:hidden;border-left:3px solid transparent;transition:border-color .15s}
.sc:hover{border-color:rgba(124,58,237,.3);border-left-color:var(--accent2)}

/* Hot card (3+ mentions) */
.sc.hot{border-color:var(--hot-bd);border-left:3px solid #f59e0b;background:var(--hot-bg)}
.sc.hot:hover{border-color:rgba(245,158,11,.55)}

/* Card header */
.sc-head{padding:11px 14px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  border-bottom:1px solid var(--border2)}
.sc-code{font-size:10px;font-weight:700;color:var(--accent2);background:rgba(124,58,237,.1);
  padding:2px 8px;border-radius:4px;font-family:monospace;flex-shrink:0}
.sc-name{font-size:14px;font-weight:700;color:var(--bright)}
.sc-sector{font-size:11px;color:var(--muted);background:var(--bg3);
  padding:2px 8px;border-radius:100px}
.sc-spacer{flex:1}
.sc-hosts{display:flex;gap:4px;align-items:center}
.host-pill{font-size:10px;color:var(--muted);background:var(--bg3);
  border:1px solid var(--border);padding:1px 7px;border-radius:100px}
.hot-badge{font-size:10px;font-weight:700;color:#f59e0b;background:rgba(245,158,11,.12);
  border:1px solid rgba(245,158,11,.3);padding:2px 8px;border-radius:100px}
.sc-cnt{font-size:11px;color:var(--dimmer);flex-shrink:0}

/* Mention rows */
.mr{display:flex;gap:12px;padding:9px 14px;border-bottom:1px solid var(--border2)}
.mr:last-child{border-bottom:none}
.mr-left{display:flex;flex-direction:column;align-items:flex-start;gap:4px;flex-shrink:0;width:80px}
.mr-speaker{font-size:11px;font-weight:600;color:var(--text)}
.mr-host{font-size:10px;color:var(--accent2);background:rgba(124,58,237,.07);
  border:1px solid rgba(124,58,237,.12);padding:1px 6px;border-radius:100px;white-space:nowrap}
.mr-right{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.mr-tags{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.sent{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;border:1px solid}
.sent.bull{background:var(--up-bg);color:var(--up);border-color:var(--up-bd)}
.sent.bear{background:var(--dn-bg);color:var(--dn);border-color:var(--dn-bd)}
.sent.hold{background:var(--bg3);color:var(--muted);border-color:var(--border)}
.sent.watch{background:rgba(245,158,11,.1);color:#f59e0b;border-color:rgba(245,158,11,.25)}
.mr-tp{font-size:10px;font-weight:700;color:#f59e0b;background:rgba(245,158,11,.1);
  border:1px solid rgba(245,158,11,.2);padding:2px 7px;border-radius:4px}
.mr-quote{font-size:12.5px;color:var(--text2);line-height:1.65}

/* Loading / empty */
.loading{text-align:center;padding:60px 0;color:var(--muted);font-size:14px}
.empty-day{font-size:13px;color:var(--dimmer);padding:12px 0}
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo"><em>MAGI</em> &nbsp;智能分析</a>
  <div class="nav-right">
    <div class="nav-links">
      <a href="/">首頁</a>
      <a href="/archive.html">報告庫</a>
      <a href="/recent.html" class="active">近日熱點</a>
      <a href="/search.html">知識庫</a>
    </div>
    <button id="theme-btn" class="theme-btn" onclick="magiToggleTheme()" aria-label="切換主題">🌙</button>
  </div>
</nav>

<div class="page-wrap">
  <div class="page-header">
    <div class="page-title">近日熱點</div>
    <div class="page-sub">過去 3 天各家開會 + 廢想法的個股討論</div>
  </div>
  <div id="content"><div class="loading">載入中…</div></div>
</div>

<script>
(function(){
  var t=localStorage.getItem('magi-theme');
  if(t) document.documentElement.setAttribute('data-theme',t);
  else if(window.matchMedia('(prefers-color-scheme:dark)').matches)
    document.documentElement.setAttribute('data-theme','dark');
})();
function magiToggleTheme(){
  var cur=document.documentElement.getAttribute('data-theme');
  var next=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('magi-theme',next);
  document.getElementById('theme-btn').textContent=next==='dark'?'☀️':'🌙';
}
(function(){
  var t=document.documentElement.getAttribute('data-theme');
  var btn=document.getElementById('theme-btn');
  if(btn) btn.textContent=t==='dark'?'☀️':'🌙';
})();

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function sentClass(s){
  if(!s) return 'hold';
  var sl=s.toLowerCase();
  if(sl.includes('積極')||sl.includes('強烈')||sl.includes('看多')||sl.includes('加碼')||sl.includes('買入')||sl.includes('計劃買')) return 'bull';
  if(sl.includes('看空')||sl.includes('空頭')||sl.includes('減碼')||sl.includes('存疑')) return 'bear';
  if(sl.includes('中性')||sl.includes('持有')) return 'hold';
  return 'watch';
}

function getDates(){
  var today=new Date();
  var dates=[];
  for(var i=0;i<3;i++){
    var d=new Date(today);
    d.setDate(today.getDate()-i);
    dates.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));
  }
  return dates;
}

async function fetchJSON(url){
  try{
    var r=await fetch(url+'?t='+Date.now());
    if(!r.ok) return [];
    return await r.json();
  }catch(e){ return []; }
}

async function loadAll(){
  var dates=getDates();
  var months={};
  dates.forEach(function(d){ months[d.slice(0,7)]=1; });
  var dateSet=new Set(dates);
  var fetches=[];
  Object.keys(months).forEach(function(m){
    fetches.push(fetchJSON('/data/meeting/'+m+'.json'));
    fetches.push(fetchJSON('/data/daily/'+m+'.json'));
  });
  var results=await Promise.all(fetches);
  var all=[];
  results.forEach(function(arr){ all=all.concat(arr||[]); });
  return {records:all.filter(function(r){ return dateSet.has(r.date); }), dates:dates};
}

function groupData(records){
  var byDate={};
  records.forEach(function(r){
    if(!byDate[r.date]) byDate[r.date]={};
    var c=r.code;
    if(!byDate[r.date][c]) byDate[r.date][c]={code:c,name:r.name,sector:r.sector,mentions:[],hosts:new Set()};
    byDate[r.date][c].mentions.push(r);
    var h=r.source_type==='daily'?'廢想法':(r.host||'');
    if(h) byDate[r.date][c].hosts.add(h);
  });
  return byDate;
}

function renderCard(entry){
  var hot=entry.mentions.length>=3;
  var hostPills=Array.from(entry.hosts).map(function(h){
    return '<span class="host-pill">'+esc(h)+'</span>';
  }).join('');

  var rows=entry.mentions.map(function(m){
    var host=m.source_type==='daily'?'廢想法':(m.host||'');
    var sc=sentClass(m.sentiment);
    var tp=m.tp?'<span class="mr-tp">TP '+esc(m.tp)+'</span>':'';
    var quote=m.quote?'<div class="mr-quote">'+esc(m.quote)+'</div>':'';
    return '<div class="mr">'
      +'<div class="mr-left">'
        +(m.speaker?'<span class="mr-speaker">'+esc(m.speaker)+'</span>':'')
        +(host?'<span class="mr-host">'+esc(host)+'</span>':'')
      +'</div>'
      +'<div class="mr-right">'
        +'<div class="mr-tags">'
          +'<span class="sent '+sc+'">'+esc(m.sentiment||'觀察')+'</span>'
          +tp
        +'</div>'
        +quote
      +'</div>'
      +'</div>';
  }).join('');

  return '<div class="sc'+(hot?' hot':'')+'">'
    +'<div class="sc-head">'
      +'<span class="sc-code">'+esc(entry.code)+'</span>'
      +'<span class="sc-name">'+esc(entry.name)+'</span>'
      +(entry.sector?'<span class="sc-sector">'+esc(entry.sector)+'</span>':'')
      +'<span class="sc-spacer"></span>'
      +'<div class="sc-hosts">'+hostPills+'</div>'
      +(hot?'<span class="hot-badge">熱議 '+entry.mentions.length+'則</span>':'<span class="sc-cnt">'+entry.mentions.length+' 則</span>')
    +'</div>'
    +rows
    +'</div>';
}

function renderPage(byDate, dates){
  var today=dates[0];
  var html='';
  dates.forEach(function(date){
    var stocks=byDate[date]?Object.values(byDate[date]):[];
    stocks.sort(function(a,b){ return b.mentions.length-a.mentions.length; });

    html+='<div class="date-section">';
    html+='<div class="date-label">'
      +'<span class="date-badge">'+date+'</span>'
      +(date===today?'<span class="date-today">今日</span>':'')
      +'<span class="date-count">'+stocks.length+' 支個股</span>'
      +'</div>';

    if(!stocks.length){
      html+='<div class="empty-day">當日無資料</div>';
    } else {
      stocks.forEach(function(entry){ html+=renderCard(entry); });
    }
    html+='</div>';
  });
  return html;
}

(async function(){
  var res=await loadAll();
  if(!res.records.length){
    document.getElementById('content').innerHTML='<div class="loading">近 3 日暫無資料</div>';
    return;
  }
  var byDate=groupData(res.records);
  document.getElementById('content').innerHTML=renderPage(byDate, res.dates);
})();
</script>
</body>
</html>
